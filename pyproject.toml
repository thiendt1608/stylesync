[project]
name = "stylesync"
version = "0.0.1"
description = "Local style rewriter: rewrite neutral text into the owner's voice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "mcp>=2,<3",
    "openai>=2,<3",
    "platformdirs>=4",
    "pyyaml>=6",
]

[dependency-groups]
spike = [
    "huggingface_hub>=0.30",
    "psutil>=6",
]
dev = [
    "pytest>=8",
    {include-group = "eval"},
]
# Phase 5 eval: style classifier and few-shot retrieval.
eval = [
    "scikit-learn>=1.5",
]
# Phase 4 training: CUDA GPU on Linux/WSL2 only (3060 or Colab). `uv sync --group train` there.
train = [
    "unsloth==2026.10.10 ; sys_platform == 'linux'",
    "unsloth_zoo==2026.10.10 ; sys_platform == 'linux'",
]

[project.scripts]
stylesync-mcp = "stylesync.mcp_server:main"
stylesync-data = "stylesync.clean.pipeline:main"
stylesync-neutralize = "stylesync.neutralize.run:main"
stylesync-dataset = "stylesync.dataset.build:main"
stylesync-train = "stylesync.train.sft:main"
stylesync-eval = "stylesync.eval.run:main"
stylesync-export = "stylesync.export.parity:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stylesync"]
